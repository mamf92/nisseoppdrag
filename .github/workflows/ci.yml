name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @nisseoppdrag/web exec playwright install --with-deps chromium
      - name: Start local Supabase for the sign-in flow
        run: |
          pnpm exec supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor
          pnpm exec supabase status -o env > "$RUNNER_TEMP/supabase.env"
          # key names differ between CLI versions
          value() { grep -E "^($1)=" "$RUNNER_TEMP/supabase.env" | head -1 | cut -d= -f2- | tr -d '"'; }
          {
            echo "VITE_SUPABASE_URL=$(value API_URL)"
            echo "VITE_SUPABASE_ANON_KEY=$(value 'ANON_KEY|PUBLISHABLE_KEY')"
            echo "E2E_SUPABASE_URL=$(value API_URL)"
            echo "E2E_SUPABASE_SERVICE_KEY=$(value 'SERVICE_ROLE_KEY|SECRET_KEY')"
          } >> "$GITHUB_ENV"
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: apps/web/screenshots
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase db start
      - run: pnpm exec supabase test db
      - name: Generated types are up to date
        run: |
          pnpm gen:types
          git diff --exit-code apps/web/src/lib/database.types.ts
      - run: pnpm exec supabase db lint --level warning
